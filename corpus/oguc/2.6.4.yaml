norma_id: oguc
articulo: 2.6.4
materia: 'Conjunto Armónico: condiciones para tener esa calidad'
cita: Para los efectos previstos en los artículos 107, 108 y 109 de la Ley General de Urbanismo y Construcciones,
  se considerará que un proyecto tiene la calidad de Conjunto Armónico, cuando cumple con alguna de las
  condiciones que se señalan a continuación y con las exigencias que para cada caso se establecen, sin
  perjuicio de lo prescrito en los artículos 2.6.15.
hechos:
  dimension_a:
    expresion: superficie_predio_m2 >= 5 * superficie_predial_minima and superficie_predio_m2 >= 5000
    cita:
      norma_id: oguc
      articulo: 2.6.4
    nota: 'Plenamente expresable: sus dos conjuntos son datos del proyecto.'
  conjunto_armonico:
    expresion: acoge_conjunto_armonico >= 1
    cita:
      norma_id: oguc
      articulo: 2.6.4
    nota: 'Acogerse es una FACULTAD del titular que exige un plan aprobado por la DOM (art. 107
      LGUC). No se constata solo por cumplir la condicion de dimension: si asi fuera, cualquier
      predio de mas de 5.000 m2 excederia el cus en un 50 %. Por eso este hecho es una condicion
      aparte, y las excepciones de 2.6.5 lo exigen junto con la dimension.'
hechos_pendientes:
  dimension_b: Constituir una manzana existente exige datos catastrales que el proyecto no declara.
  dimension_c: 'La fusión predial del art. 63 del DFL 458 exige el historial registral. NO se expresa
    solo la superficie: daría por cumplida la 1.c) a un predio que no es fusión, y con eso el +30 % de
    cus.'
  condicion_uso: Requiere el destino del proyecto (equipamiento) y el art. 2.1.36.
preguntas:
  dimension_b:
    tipo: noul
    instrucciones: >
      El predio del proyecto constituye una manzana existente, en el sentido de la letra a) del
      numero 1. del articulo 2.6.4 de la OGUC. Afirmarlo exige que el predio coincida con una manzana
      ya conformada del area urbana, y no con un terreno interior que todavia podria subdividirse. Si
      el expediente no trae el plano de loteo o el certificado de informaciones previas que lo
      acredite, responde con una probabilidad baja: no se trata de suponer, sino de leer.
    cita:
      norma_id: oguc
      articulo: 2.6.4
  dimension_c:
    tipo: noul
    instrucciones: >
      El predio del proyecto es el resultado de una fusion predial acogida al articulo 63 del DFL
      458, en el sentido de la letra c) del numero 1. del articulo 2.6.4 de la OGUC. NO BASTA con que
      la superficie declarada sea la suma de varios predios: se necesita el acto registral de fusion.
      Si el expediente no lo acredita, responde con una probabilidad baja.
    cita:
      norma_id: oguc
      articulo: 2.6.4
  condicion_uso:
    tipo: choice
    instrucciones: >
      Clasifique el destino principal de la edificacion que declara el expediente. Elija
      'equipamiento' solo si el destino principal es de equipamiento; 'vivienda' si es residencial;
      'otro' si el expediente no permite asignar un destino principal, o si es distinto de los dos
      anteriores.
    criterios:
      equipamiento: 'Destino principal de equipamiento: comercio, servicios, salud, educacion o esparcimiento.'
      vivienda: 'Destino principal residencial (vivienda).'
      otro: 'El expediente no permite asignar un destino principal, o es uno distinto de vivienda y equipamiento.'
    verdadero_si: [equipamiento]
    cita:
      norma_id: oguc
      articulo: 2.6.4
