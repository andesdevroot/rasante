norma_id: oguc
articulo: 2.6.5
materia: 'Conjunto Armónico: excepción al coeficiente de constructibilidad'
cita: Los proyectos que cumplan con la condición de dimensión a que se refieren las letras a) o b) del
  número 1. del artículo 2.6.4., podrán exceder hasta en un 50% el coeficiente de constructibilidad establecido
  por el Plan Regulador respectivo.
excepciones:
  - parametro: cus
    hechos: [conjunto_armonico, dimension_a]
    factor: '1.5'
    nota: 'Letra a): acogido al Conjunto Armonico Y terreno de superficie suficiente. El valor NO
      esta aca: es 1,5 veces el cus que fije cada plan regulador, y por eso la excepcion vive en el
      articulo nacional y no en la zona.'
  - parametro: cus
    hechos: [conjunto_armonico, dimension_b]
    factor: '1.5'
    nota: 'Letra b): predio que constituye en si una manzana existente. Mismo 50 % que la letra a),
      por otro camino: la norma dice "las letras a) o b)".'
  - parametro: cus
    hechos: [conjunto_armonico, dimension_c]
    factor: '1.3'
    cita:
      texto: Los proyectos que cumplan con la condición de dimensión a que se refiere la letra c) del
        número 1. del artículo 2.6.4., podrán exceder hasta en un 30% el coeficiente de constructibilidad
        establecido por el Plan Regulador respectivo.
    nota: 'Letra c): fusion predial. 30 %, no 50 %: son dos incisos distintos del mismo articulo, y
      por eso lleva cita propia.'
