norma_id: oguc
articulo: 2.1.22
materia: 'Densidad: los IPT deben expresarla en densidad bruta en habitantes por hectárea'
cita: Los Instrumentos de Planificación Territorial que fijen densidad, deberán expresarla en densidad
  bruta en habitantes por hectárea y se entenderá que su equivalencia o conversión en número de viviendas
  será igual al valor que resulte de dividir la densidad establecida por el coeficiente 4. El parámetro
  de densidad establecido en los instrumentos de planificación territorial sólo se aplicará al destino
  de vivienda del tipo de uso de suelo residencial. 2
regla:
  tipo: unidad_y_conversion
  expresion_obligatoria: densidad bruta
  unidad: hab/ha
  factor_habitantes_por_vivienda: '4'
  conversion_a_viviendas: densidad_bruta / 4
  alcance: solo se aplica al destino vivienda del tipo de uso de suelo residencial
  expresion: numero_viviendas / (superficie_predio_m2 / 10000)
