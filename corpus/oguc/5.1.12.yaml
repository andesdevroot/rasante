norma_id: oguc
articulo: 5.1.12
materia: 'Coeficiente de constructibilidad: cálculo separado; el subterráneo no se contabiliza'
cita: Para la aplicación del coeficiente de constructibilidad debe presentarse el cálculo de superficie
  edificada separado en superficie edificada sobre el terreno natural o el suelo resultante del proyecto
  si éste fuere más bajo que el terreno natural y superficie edificada en subterráneo, para los efectos
  de no contabilizar ésta última.1 Con todo, cuando en los subterráneos se contemplen unidades con destino
  residencial, las superficies útiles de estas unidades deberán contabilizarse para el coeficiente de
  constructibilidad.2
regla:
  tipo: exclusion
  parametro: cus
  computo: cálculo separado en sobre terreno natural y en subterráneo
  exclusion: la superficie edificada en subterráneo no se contabiliza
  excepcion: si en los subterráneos hay unidades con destino residencial, sus superficies útiles sí se
    contabilizan
