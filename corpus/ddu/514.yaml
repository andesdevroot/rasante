norma_id: ddu-514
circular: '514'
materia: Formato Tipo del Informe del Revisor Independiente
cita: Circular DDU 514, Santiago 10 de enero de 2025. Distribuye el Formulario con formato tipo del Informe
  del Revisor Independiente, conforme a la Ley N°21.718 que modifica el artículo 116 bis de la Ley General
  de Urbanismo y Construcciones.
base_legal: Ley N°21.718, que modifica el artículo 116 bis de la LGUC
leyenda_veredictos:
  C: Cumple con exigencias normativas
  NC: No cumple con exigencia normativa
  P: Pendiente
  NP: No procede
  PR: Plan Regulador
secciones:
- I. Identificación del propietario y profesionales
- II. Información del predio
- III. Información del proyecto
- IV. Normas a las que se acoge el proyecto
- V. Descripción del proyecto
- C. Cumplimiento de las normas urbanísticas
- D. Cumplimiento de otras normas asociadas
- E. Capítulos 1, 2 y 3 del Título 4 OGUC
- F. Capítulos 4 al 14 del Título 4 OGUC
- G. Instalaciones y pavimentación de calzadas
