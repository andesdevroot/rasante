norma_id: prc:nunoa
zona: Z-2
nombre: 'Z-2'
comuna: Ñuñoa
articulo: '26'
materia: 'Zona Z-2: normas de edificación y subdivisión (Artículo 26 del PRC de Ñuñoa)'
cita: 'ZONA Z- 2  (104) Superficie de subdivisión predial mínima 500 m²'
hechos:
  edificio_de_4_pisos_o_mas:
    expresion: numero_pisos >= 4 and altura_m >= 12
    cita:
      norma_id: prc:nunoa
      articulo: '26'
      texto: Distanciamiento mínimo a los deslindes en edificios de 4 pisos y altura 12 m o más.
    nota: 'Es la condición que separa los dos tramos de distanciamiento de la zona.'
  mas_de_tres_pisos:
    expresion: numero_pisos > 3
    cita:
      norma_id: prc:nunoa
      articulo: '26'
      texto: En todos los Conjuntos Habitacionales cuya altura sean mayores a tres pisos
    nota: 'Condición del área libre de esparcimiento. OJO: la norma dice "Conjuntos
      Habitacionales", y eso es una condición ADICIONAL que hay que clasificar, como
      dimension_b. Acá está solo la parte aritmética.'
derivaciones:
  area_libre:
    expresion: superficie_libre_m2 / superficie_predio_m2
    cita:
      norma_id: prc:nunoa
      articulo: '26'
      texto: deberá destinarse un 30% del total del terreno a Área Libre de Esparcimiento
  area_libre_techada:
    expresion: superficie_libre_techada_m2 / superficie_libre_m2
    cita:
      norma_id: prc:nunoa
      articulo: '26'
      texto: la que podrá ser techada hasta un 30%
parametros:
  superficie_predial_minima:
    id: superficie_predial_minima
    sentido: minimo
    limites:
      - tipo: base
        valor: '500'
        unidad: m²
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Superficie de subdivisión predial mínima 500 m²
  cos:
    id: cos
    sentido: maximo
    limites:
      - tipo: base
        valor: '0,5'
        unidad: adimensional
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Coeficiente de ocupación de suelo 0,5
  cus:
    id: cus
    sentido: maximo
    limites:
      - tipo: base
        valor: '2'
        unidad: adimensional
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Coeficiente de constructibilidad 2
  altura_maxima:
    id: altura_maxima
    sentido: maximo
    limites:
      - tipo: base
        valor: '28,00'
        unidad: m
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Altura máxima de edificación. 10 pisos y 28,00 m
  pisos_maximos:
    id: pisos_maximos
    sentido: maximo
    limites:
      - tipo: base
        valor: '10'
        unidad: pisos
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Altura máxima de edificación. 10 pisos y 28,00 m
    nota: 'La ordenanza escribe la altura como "10 pisos **y** 28,00 m": dos cotas superiores
      simultáneas en unidades distintas. `altura_maxima` y `pisos_maximos` son el mismo renglón
      partido en dos, y ambos deben cumplirse.'
  densidad.bruta:
    id: densidad
    calificador: bruta
    sentido: maximo
    limites:
      - tipo: base
        valor: '1600'
        unidad: hab/ha
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Densidad bruta máxima 1.600 Hab/há.
    nota: 'La ordenanza escribe "1.600". Se transcribe "1600" porque `decimal_de` RECHAZA "1.600"
      como ambiguo (¿mil seiscientos o uno coma seis?) y prefiere fallar a adivinar.'
  rasante:
    id: rasante
    sentido: maximo
    limites:
      - tipo: base
        valor: '60'
        unidad: grados
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Rasante 60°
  antejarin:
    id: antejarin
    sentido: minimo
    limites:
      - tipo: base
        valor: '7,00'
        unidad: m
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Antejardín 7,00 m
  distanciamiento:
    id: distanciamiento
    sentido: minimo
    limites:
      - tipo: excepcion
        valor: '5'
        unidad: m
        cuando: [edificio_de_4_pisos_o_mas]
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Distanciamiento mínimo a los deslindes en edificios de 4 pisos y altura 12 m o más. 5 m
    nota: 'El otro tramo —edificios de hasta 3 pisos y altura 9 m— NO tiene valor propio: la
      ordenanza remite al "Art. 2.6.3 de OGUC". Sin ese valor no se emite límite, así que el
      parámetro da P en ese tramo. Es correcto: no sabemos cuánto exige la OGUC para ese caso.'
  cuerpos_salientes:
    id: cuerpos_salientes
    sentido: maximo
    limites:
      - tipo: base
        valor: '1,5'
        unidad: m
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: Cuerpos salientes de la línea de edificación sobre antejardín 1,5 m
  adosamiento:
    id: adosamiento
    sentido: maximo
    estado: desconocido
    cita:
      norma_id: prc:nunoa
      articulo: '26'
      texto: Adosamiento Según OGUC
    nota: 'La celda no contiene un número: contiene una remisión a la OGUC. Sin valor no hay nada
      que comparar, y el veredicto es P.'
  agrupamiento:
    id: agrupamiento
    sentido: maximo
    estado: desconocido
    cita:
      norma_id: prc:nunoa
      articulo: '26'
      texto: Tipos de agrupamiento Aislado, pareado
    nota: 'No es un tope: es el conjunto de tipos admitidos ("Aislado, pareado"). El modelo no sabe
      expresar "uno de estos", así que se declara desconocido en vez de fingir un límite. Además
      `agrupamiento` condiciona la altura en otras zonas de Ñuñoa (Z-1 tiene tres alturas máximas
      según el tipo), así que necesita modelarse como hecho, no como parámetro.'
  area_libre:
    id: area_libre
    sentido: minimo
    limites:
      - tipo: excepcion
        valor: '0,30'
        unidad: adimensional
        cuando: [mas_de_tres_pisos]
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: En todos los Conjuntos Habitacionales cuya altura sean mayores a tres pisos, deberá
            destinarse un 30% del total del terreno a Área Libre de Esparcimiento
    nota: 'SIN BASE a propósito. La norma no exige área libre a un edificio de hasta tres pisos:
      solo la exige por encima de ese umbral. Y el esquema no sabe expresar "este parámetro no
      aplica cuando la condición no se cumple", así que bajo la norma este parámetro dará P
      (sin_limite) en vez de NP. Es el hueco que T1.14b deja anotado. La alternativa —un base de
      0— daría un C vacuo, que es peor: afirmaría cumplimiento de algo que nadie exigió.'
  area_libre_techada:
    id: area_libre_techada
    sentido: maximo
    limites:
      - tipo: base
        valor: '0,30'
        unidad: adimensional
        cita:
          norma_id: prc:nunoa
          articulo: '26'
          texto: la que podrá ser techada hasta un 30%
    nota: 'Fracción TECHADA del área libre, sobre el área libre y no sobre el predio.'
vigencia:
  nota: 'El P_DO del IPT (27/10/1989) NO se usa como vigencia (D12): es la publicación original del
    instrumento, no la del texto refundido. El texto transcrito es el refundido de junio 2025.'
