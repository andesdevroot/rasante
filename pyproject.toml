[project]
name = "rasante"
version = "0.0.1"
description = "Copiloto open source para revisores de permisos de edificación (OGUC, Chile)"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28",
    "pypdf>=6",
    "pyyaml>=6",
    "shapely>=2",
    "typer>=0.27.2",
]

[project.scripts]
rasante = "rasante.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasante"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not integracion'"
markers = ["integracion: golpea la API real de MINVU; requiere RASANTE_INTEGRACION=1"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

# Los tests **sí** se type-chequean: los errores mecánicos de hoy (`.valor` tras cambiar el modelo,
# `id_` vs `id`, un `unidad=` que ya no existe) se descubrieron como fallos de test uno por uno en
# vez de en una sola corrida de mypy. Se relaja solo lo que en un test es legítimo: funciones sin
# anotar y pasar a propósito tipos incorrectos para comprobar que el modelo los rechaza.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false

# `shapely` no publica `py.typed`, así que mypy no puede revisar sus llamadas. Se declara explícito
# en vez de bajar el listón para todo el proyecto: lo que sí se revisa —nuestro código— se sigue
# revisando entero.
[[tool.mypy.overrides]]
module = ["shapely", "shapely.*"]
ignore_missing_imports = true
